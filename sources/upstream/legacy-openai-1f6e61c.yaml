version: 1
updated: 2026-09-27
purpose: OpenAI and ChatGPT client destination rules for sing-box
sources:
  official_network_recommendations: https://help.openai.com/en/articles/9247338-network-recommendations-for-chatgpt-errors-on-web-and-apps
  official_enterprise_network_controls: https://help.openai.com/en/articles/20001323-corporate-network-controls-in-chatgpt-enterprise
  official_ip_allowlisting_scope: https://help.openai.com/en/articles/12111596-ip-allowlisting-for-chatgpt
  sing_box_source_format: https://sing-box.sagernet.org/configuration/rule-set/source-format/
  community_cross_check: https://github.com/SagerNet/sing-geosite/blob/rule-set/geosite-openai.json
notes:
  - Wildcard entries from the official OpenAI allowlist are represented as domain_suffix.
  - No static OpenAI service IPs are included; OpenAI documents dynamic service endpoints and the IP allowlisting page is for inbound workspace controls.
  - The compatibility entries are narrow exact hosts or documented client transport suffixes; no domain_keyword rule is used.
